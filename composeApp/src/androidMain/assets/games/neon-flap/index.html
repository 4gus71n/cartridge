<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Neon Flap</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0B1020; }
  body { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #credit { position: fixed; left: 10px; bottom: 8px; font: 11px -apple-system, system-ui, sans-serif; color: rgba(255,255,255,.45); pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="credit">Neon Flap &middot; MIT License &middot; by Cartridge Studio</div>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const GRAVITY = 1900;
  const FLAP = -560;
  const PIPE_W = 74;
  const GAP = 175;
  const SPEED = 205;
  const BIRD_R = 14;
  const GROUND_Y = 0.84;

  let mode = 'ready';
  let birdY = 0, birdV = 0, birdRot = 0;
  let pipes = [], score = 0, time = 0;
  let best = 0;
  try { best = parseInt(localStorage.getItem('neon-flap-best') || '0', 10) || 0; } catch (e) { best = 0; }

  function reset() {
    birdY = H * 0.42;
    birdV = 0;
    birdRot = 0;
    pipes = [];
    score = 0;
    time = 0;
  }

  function flap() {
    if (mode === 'dead') { mode = 'ready'; reset(); return; }
    if (mode === 'ready') { mode = 'playing'; reset(); }
    birdV = FLAP;
  }

  function spawnPipe() {
    const margin = 90;
    const gapY = margin + Math.random() * (H * GROUND_Y - GAP - margin * 2);
    pipes.push({ x: W + PIPE_W, gapY, scored: false });
  }

  function update(dt) {
    time += dt;
    if (mode !== 'playing') return;

    birdV += GRAVITY * dt;
    birdY += birdV * dt;
    birdRot = Math.max(-0.5, Math.min(1.2, birdV / 900));

    if (pipes.length === 0 || pipes[pipes.length - 1].x < W - 230) spawnPipe();

    const speed = SPEED + Math.min(140, score * 4);
    for (const p of pipes) p.x -= speed * dt;

    const bx = W * 0.30;
    for (const p of pipes) {
      if (!p.scored && p.x + PIPE_W < bx - BIRD_R) { p.scored = true; score += 1; }
      const inX = bx + BIRD_R > p.x && bx - BIRD_R < p.x + PIPE_W;
      if (inX && (birdY - BIRD_R < p.gapY || birdY + BIRD_R > p.gapY + GAP)) { die(); return; }
    }
    while (pipes.length && pipes[0].x + PIPE_W < -20) pipes.shift();

    if (birdY + BIRD_R > H * GROUND_Y || birdY - BIRD_R < 0) die();
  }

  function die() {
    mode = 'dead';
    if (score > best) {
      best = score;
      try { localStorage.setItem('neon-flap-best', String(best)); } catch (e) {}
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
  }

  function draw() {
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#0B1020');
    bg.addColorStop(1, '#1B2350');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    for (let i = 0; i < 28; i++) {
      const sx = (i * 137.5) % W;
      const sy = (i * 91.7) % (H * 0.8);
      ctx.globalAlpha = 0.15 + 0.35 * (0.5 + 0.5 * Math.sin(time * 2 + i));
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(sx, sy, 2, 2);
    }
    ctx.globalAlpha = 1;

    ctx.fillStyle = '#0F172A';
    ctx.fillRect(0, H * GROUND_Y, W, H * (1 - GROUND_Y));
    ctx.strokeStyle = 'rgba(34,211,238,.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, H * GROUND_Y);
    ctx.lineTo(W, H * GROUND_Y);
    ctx.stroke();

    for (const p of pipes) {
      ctx.save();
      ctx.shadowColor = '#22D3EE';
      ctx.shadowBlur = 14;
      ctx.fillStyle = '#22D3EE';
      roundRect(p.x, -10, PIPE_W, p.gapY + 10, 12);
      roundRect(p.x, p.gapY + GAP, PIPE_W, H * GROUND_Y - (p.gapY + GAP) + 10, 12);
      ctx.restore();
    }

    const bx = W * 0.30;
    ctx.save();
    ctx.translate(bx, birdY);
    ctx.rotate(birdRot);
    ctx.shadowColor = '#FDE047';
    ctx.shadowBlur = 18;
    ctx.fillStyle = '#FDE047';
    ctx.beginPath();
    ctx.arc(0, 0, BIRD_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#0B1020';
    ctx.beginPath();
    ctx.arc(5, -4, 3.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.textAlign = 'center';
    ctx.fillStyle = '#FFFFFF';
    ctx.font = '800 64px -apple-system, system-ui, sans-serif';
    ctx.fillText(String(score), W / 2, H * 0.16);
    ctx.fillStyle = 'rgba(255,255,255,.65)';
    ctx.font = '600 14px -apple-system, system-ui, sans-serif';
    ctx.fillText('BEST ' + best, W / 2, H * 0.205);

    if (mode === 'ready') banner('TAP TO FLAP', 'Keep the dot flying');
    else if (mode === 'dead') banner('GAME OVER', 'Tap to try again');
  }

  function banner(title, sub) {
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,.96)';
    ctx.font = '800 26px -apple-system, system-ui, sans-serif';
    ctx.fillText(title, W / 2, H * 0.55);
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    ctx.font = '500 15px -apple-system, system-ui, sans-serif';
    ctx.fillText(sub, W / 2, H * 0.59);
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  window.addEventListener('pointerdown', (e) => { e.preventDefault(); flap(); });
  window.addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); flap(); } });
  document.addEventListener('visibilitychange', () => { last = performance.now(); });

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
