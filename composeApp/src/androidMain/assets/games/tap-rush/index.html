<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Tap Rush</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #031B1B; }
  body { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #credit { position: fixed; left: 10px; bottom: 8px; font: 11px -apple-system, system-ui, sans-serif; color: rgba(255,255,255,.45); pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="credit">Tap Rush &middot; MIT License &middot; by Cartridge Studio</div>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const DURATION = 15;
  const COLORS = ['#2DD4BF', '#FDE047', '#F472B6', '#60A5FA'];

  let mode = 'ready';
  let timeLeft = DURATION;
  let hits = 0;
  let targets = [];
  let spawnTimer = 0;
  let best = 0;
  try { best = parseInt(localStorage.getItem('tap-rush-best') || '0', 10) || 0; } catch (e) { best = 0; }

  function reset() {
    timeLeft = DURATION;
    hits = 0;
    targets = [];
    spawnTimer = 0;
  }

  function start() { mode = 'playing'; reset(); }

  function spawnTarget() {
    const r = 32 + Math.random() * 16;
    const margin = 16;
    const top = 96;
    const bottom = H - 56;
    const x = margin + r + Math.random() * Math.max(1, W - (margin + r) * 2);
    const y = top + r + Math.random() * Math.max(1, bottom - top - r * 2);
    const color = COLORS[Math.floor(Math.random() * COLORS.length)];
    targets.push({ x, y, r, life: 1.15, age: 0, color });
  }

  function update(dt) {
    if (mode !== 'playing') return;
    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; die(); return; }

    spawnTimer -= dt;
    if (spawnTimer <= 0 && targets.length < 4) {
      spawnTarget();
      spawnTimer = Math.max(0.3, 0.62 - (DURATION - timeLeft) * 0.02);
    }

    for (const t of targets) t.age += dt;
    targets = targets.filter((t) => t.age < t.life);
  }

  function die() {
    mode = 'dead';
    if (hits > best) {
      best = hits;
      try { localStorage.setItem('tap-rush-best', String(best)); } catch (e) {}
    }
  }

  function draw() {
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#031B1B');
    bg.addColorStop(1, '#0C4A44');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    for (const t of targets) {
      const k = 1 - t.age / t.life;
      const r = t.r * (0.6 + 0.4 * k);
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, k * 1.4));
      ctx.shadowColor = t.color;
      ctx.shadowBlur = 18;
      ctx.strokeStyle = t.color;
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(t.x, t.y, r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = t.color;
      ctx.beginPath();
      ctx.arc(t.x, t.y, r * 0.35, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    ctx.fillStyle = 'rgba(255,255,255,.15)';
    ctx.fillRect(0, 0, W, 6);
    ctx.fillStyle = '#2DD4BF';
    ctx.fillRect(0, 0, W * (timeLeft / DURATION), 6);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#FFFFFF';
    ctx.font = '800 56px -apple-system, system-ui, sans-serif';
    ctx.fillText(String(hits), W / 2, 72);
    ctx.fillStyle = 'rgba(255,255,255,.65)';
    ctx.font = '600 14px -apple-system, system-ui, sans-serif';
    ctx.fillText('BEST ' + best, W / 2, 96);

    if (mode === 'ready') banner('TAP THE RINGS', '15 seconds. Go.');
    else if (mode === 'dead') banner('TIME!', 'You hit ' + hits + '. Tap to retry');
  }

  function banner(title, sub) {
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,.96)';
    ctx.font = '800 26px -apple-system, system-ui, sans-serif';
    ctx.fillText(title, W / 2, H * 0.55);
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    ctx.font = '500 15px -apple-system, system-ui, sans-serif';
    ctx.fillText(sub, W / 2, H * 0.59);
  }

  window.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const x = e.clientX, y = e.clientY;
    if (mode === 'ready' || mode === 'dead') { start(); return; }
    for (let i = targets.length - 1; i >= 0; i--) {
      const t = targets[i];
      const dx = x - t.x, dy = y - t.y;
      if (dx * dx + dy * dy <= t.r * t.r) {
        targets.splice(i, 1);
        hits += 1;
        return;
      }
    }
  });
  document.addEventListener('visibilitychange', () => { last = performance.now(); });

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
