<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Dot Dodge</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #12071F; }
  body { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #credit { position: fixed; left: 10px; bottom: 8px; font: 11px -apple-system, system-ui, sans-serif; color: rgba(255,255,255,.45); pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="credit">Dot Dodge &middot; MIT License &middot; by Cartridge Studio</div>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const PLAYER_R = 16;

  let mode = 'ready';
  let px = 0, py = 0, tx = 0, ty = 0;
  let blocks = [], elapsed = 0, score = 0, spawnTimer = 0;
  let best = 0;
  try { best = parseInt(localStorage.getItem('dot-dodge-best') || '0', 10) || 0; } catch (e) { best = 0; }

  function reset() {
    px = W / 2; py = H * 0.72; tx = px; ty = py;
    blocks = []; elapsed = 0; score = 0; spawnTimer = 0.5;
  }

  function start() { mode = 'playing'; reset(); }

  function spawnBlock() {
    const size = 24 + Math.random() * 26;
    const x = size + Math.random() * Math.max(1, W - size * 2);
    const speed = 230 + Math.min(340, elapsed * 22);
    blocks.push({
      x, y: -size, size, speed,
      rot: Math.random() * Math.PI,
      spin: (Math.random() - 0.5) * 3,
    });
  }

  function update(dt) {
    if (mode !== 'playing') return;
    elapsed += dt;
    score = Math.floor(elapsed * 10);

    px += (tx - px) * Math.min(1, dt * 14);
    py += (ty - py) * Math.min(1, dt * 14);

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnBlock();
      spawnTimer = Math.max(0.28, 0.75 - elapsed * 0.014);
    }

    for (const b of blocks) {
      b.y += b.speed * dt;
      b.rot += b.spin * dt;
    }

    for (const b of blocks) {
      const cx = Math.max(b.x, Math.min(px, b.x + b.size));
      const cy = Math.max(b.y, Math.min(py, b.y + b.size));
      const dx = px - cx, dy = py - cy;
      if (dx * dx + dy * dy < PLAYER_R * PLAYER_R) { die(); return; }
    }
    while (blocks.length && blocks[0].y > H + 80) blocks.shift();
  }

  function die() {
    mode = 'dead';
    if (score > best) {
      best = score;
      try { localStorage.setItem('dot-dodge-best', String(best)); } catch (e) {}
    }
  }

  function draw() {
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#12071F');
    bg.addColorStop(1, '#3B0A54');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    ctx.globalAlpha = 0.12;
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineWidth = 1;
    for (let gx = 0; gx < W; gx += 42) {
      ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    blocks.forEach((b, i) => {
      ctx.save();
      ctx.translate(b.x + b.size / 2, b.y + b.size / 2);
      ctx.rotate(b.rot);
      ctx.shadowColor = i % 2 === 0 ? '#F472B6' : '#22D3EE';
      ctx.shadowBlur = 14;
      ctx.fillStyle = i % 2 === 0 ? '#F472B6' : '#22D3EE';
      ctx.fillRect(-b.size / 2, -b.size / 2, b.size, b.size);
      ctx.restore();
    });

    ctx.save();
    ctx.shadowColor = '#4ADE80';
    ctx.shadowBlur = 20;
    ctx.fillStyle = '#4ADE80';
    ctx.beginPath();
    ctx.arc(px, py, PLAYER_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#052E16';
    ctx.beginPath();
    ctx.arc(px, py, PLAYER_R * 0.45, 0, Math.PI * 2);
    ctx.fill();

    ctx.textAlign = 'center';
    ctx.fillStyle = '#FFFFFF';
    ctx.font = '800 56px -apple-system, system-ui, sans-serif';
    ctx.fillText(String(score), W / 2, H * 0.14);
    ctx.fillStyle = 'rgba(255,255,255,.65)';
    ctx.font = '600 14px -apple-system, system-ui, sans-serif';
    ctx.fillText('BEST ' + best, W / 2, H * 0.18);

    if (mode === 'ready') banner('DRAG TO DODGE', 'Survive the falling rain');
    else if (mode === 'dead') banner('CRUSHED', 'Tap to try again');
  }

  function banner(title, sub) {
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,.96)';
    ctx.font = '800 26px -apple-system, system-ui, sans-serif';
    ctx.fillText(title, W / 2, H * 0.55);
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    ctx.font = '500 15px -apple-system, system-ui, sans-serif';
    ctx.fillText(sub, W / 2, H * 0.59);
  }

  function movePointer(e) {
    tx = e.clientX;
    ty = e.clientY;
  }

  function pressPointer(e) {
    e.preventDefault();
    movePointer(e);
    if (mode === 'ready' || mode === 'dead') start();
  }

  window.addEventListener('pointerdown', pressPointer);
  window.addEventListener('pointermove', movePointer);
  document.addEventListener('visibilitychange', () => { last = performance.now(); });

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
